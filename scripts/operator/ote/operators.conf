# OTE operator mapping used by custom-ocp4.x-powervm-ote-operator-tests.
# One operator per line:
#   name|image|test binary path inside the image|suites (comma separated, first one is the default)
#
# image:
#   - repo only (no tag)        -> the job uses the newest main-branch build on quay
#                                  (Konflux tags each main build with its git commit SHA; on-pr-* builds are skipped)
#   - repo:tag or repo@sha256:.. -> used as is
#   The job's OperatorImage parameter overrides this for one run.
# A binary path ending in .gz is decompressed after extraction.
# To add an operator: add a line here and add the name to the Operator choice in the Jenkinsfile.

kube-descheduler|quay.io/redhat-user-workloads/kdo-workloads-tenant/kube-descheduler-operator-main|/usr/bin/cluster-kube-descheduler-operator-tests-ext.gz|openshift/cluster-kube-descheduler-operator/operator/serial
