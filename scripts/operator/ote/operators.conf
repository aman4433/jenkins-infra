# Operator mapping used by custom-ocp4.x-powervm-ote-operator-tests.
# One operator per line, fields separated by |. The second field is the test type.
#
# ote      : name|ote|image|test binary path inside the image|suites (comma separated, first one is the default)
#            image: repo only (no tag) -> newest main-branch build on quay (Konflux tags each main build with its
#            git commit SHA; on-pr-* builds are skipped). repo:tag or repo@sha256:... is used as is.
#            The job's OperatorImage parameter overrides it for one run. A binary path ending in .gz is decompressed.
#
# playbook : name|playbook|script that runs the ocp4-playbooks-extras playbook|env var the script reads the
#            catalog source image from (filled from the job's IndexImage parameter)|results directory on the bastion
#            Scripts live in scripts/operator/ and are shared with custom-ocp4.x-powervm-p9-deploy-operator-tests.
#
# To add an operator: add a line here and add the name to the Operator choice in the Jenkinsfile.

kube-descheduler|ote|quay.io/redhat-user-workloads/kdo-workloads-tenant/kube-descheduler-operator-main|/usr/bin/cluster-kube-descheduler-operator-tests-ext.gz|openshift/cluster-kube-descheduler-operator/operator/serial
compliance|playbook|scripts/operator/compliance_operator.sh|COMPLIANCE_CATALOGSOURCE_IMAGE|/tmp/compliance
